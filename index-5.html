<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Isa D. Fulani Communication World</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#eef4ff;--card:#fff;--tx:#0f1b3d;--mu:#5b6b8c;--ac:#1457d9;--ac2:#00b4ff;--nv:#0a1f5c;--bd:#dbe4f5;--rd:#d92d4b;--sh:0 6px 20px rgba(20,87,217,.12);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0a1230;--card:#131d44;--tx:#eaf0ff;--mu:#9db0d8;--ac:#4d8bff;--ac2:#22d3ee;--nv:#0b1a4d;--bd:#24325f;--rd:#ff6b81;--sh:0 6px 20px rgba(0,0,0,.35);color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(900px 420px at 0% -8%,rgba(0,180,255,.22),transparent),radial-gradient(700px 380px at 100% 0%,rgba(20,87,217,.16),transparent),var(--bg);min-height:100vh}
.w{max-width:920px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:0}h2{font-size:17px;margin:0 0 10px}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.c{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:var(--sh);animation:up .35s ease both}
input,select{font:inherit;padding:10px 12px;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);max-width:100%;transition:.15s}
input:focus,select:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px rgba(20,87,217,.18)}
button{font:inherit;font-weight:600;padding:10px 14px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;cursor:pointer;box-shadow:0 4px 12px rgba(20,87,217,.28);transition:transform .15s,box-shadow .15s}
button:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(20,87,217,.32)}button:active{transform:scale(.97)}
button.g{background:transparent;color:var(--ac);border:1.5px solid var(--ac);box-shadow:none}button.r{background:linear-gradient(135deg,#d92d4b,#ff6b81)}
.top>.bar{background:linear-gradient(135deg,var(--nv),var(--ac) 65%,var(--ac2));color:#fff;padding:14px 16px;border-radius:18px;margin-bottom:12px;box-shadow:var(--sh);animation:up .3s ease both}
.top>.bar .mu{color:#dbe7ff}.top>.bar button.g{color:#fff;border-color:#fff;margin-left:6px}
.nav{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 12px}
.nav button{white-space:nowrap;background:var(--card);color:var(--tx);box-shadow:var(--sh);border-radius:999px}
.nav button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}.row>*{flex:1 1 90px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{padding:9px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mu)}tr:hover td{background:rgba(20,87,217,.05)}
.mu{color:var(--mu);font-size:13px}.big{font-size:20px;font-weight:800;color:var(--ac)}.red{color:var(--rd)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hero{background:linear-gradient(135deg,var(--nv),var(--ac) 60%,var(--ac2));color:#fff;border-radius:22px;padding:16px;text-align:center;box-shadow:var(--sh);margin-bottom:16px;animation:up .4s ease both}
.hero .bar2{display:flex;justify-content:flex-end}.hero button.g{color:#fff;border-color:#fff}
.tag{font-style:italic;font-weight:600;margin:10px 0}.addr{font-size:13px;opacity:.92;margin:6px 0 0}
.pill{display:inline-block;margin:4px;padding:9px 16px;border-radius:999px;background:#fff;color:#1457d9;font-weight:700;text-decoration:none;box-shadow:0 4px 10px rgba(0,0,0,.18);transition:transform .15s}.pill:hover{transform:translateY(-2px)}
.sec{margin:6px 2px 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:12px 0 16px}
.pc{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--sh);transition:transform .2s;animation:up .4s ease both}.pc:hover{transform:translateY(-4px)}
.pc img,.pc .ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:linear-gradient(135deg,var(--bd),transparent);display:flex;align-items:center;justify-content:center;font-size:40px}
.pc b{font-size:14px}
@media print{body{background:#fff}.nav,.noprint,.bar button{display:none}.c{box-shadow:none;animation:none}.top{display:none}}
.top{position:sticky;top:0;z-index:10;background:linear-gradient(var(--bg) 88%,transparent);padding-top:4px;margin-bottom:6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand h1{font-size:15px;line-height:1.2;color:#fff}.lg{height:46px;width:auto;background:#fff;border-radius:10px;padding:2px;flex:0 0 auto}
.sw{position:relative}.sgb{display:none;position:absolute;left:0;right:0;top:100%;z-index:30;background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--sh);overflow:hidden;margin-top:4px}
.sg{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--bd)}.sg:hover{background:rgba(20,87,217,.1)}.sg span{color:var(--mu);font-size:12px;white-space:nowrap}
.lh{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;padding:12px;border-radius:16px;background:linear-gradient(135deg,rgba(20,87,217,.09),rgba(0,180,255,.09));border-bottom:3px solid var(--ac);margin-bottom:12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.lhl{height:76px;width:auto;background:#fff;border-radius:12px}.lhc{text-align:left;font-size:13px}.lha{font-weight:700;color:var(--tx)}
.lhp a{display:inline-block;margin:5px 6px 0 0;padding:4px 12px;border-radius:999px;background:var(--ac);color:#fff;text-decoration:none;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}.lhe{color:var(--mu);margin-top:5px;font-weight:600}
.addr{font-weight:700;font-size:14px}
.top>.bar{background:var(--card);color:var(--tx);border:1px solid var(--bd);position:relative;overflow:hidden;padding:10px 16px}
.top>.bar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--ac),var(--ac2),#7c3aed)}
.top>.bar .mu{color:var(--mu)}.top>.bar button.g{color:var(--ac);border-color:var(--ac)}.lg{height:58px}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(520px 420px at 18% 18%,rgba(0,180,255,.22),transparent),radial-gradient(520px 420px at 82% 8%,rgba(124,58,237,.13),transparent),radial-gradient(620px 520px at 62% 92%,rgba(20,87,217,.16),transparent);animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,3%) scale(1.08)}}
.gt{font-size:24px;margin:8px 2px 2px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.pc.sel{border-color:var(--ac);box-shadow:0 0 0 3px rgba(20,87,217,.22),var(--sh)}
.pc img,.pc .ph{transition:transform .35s}.pc:hover img{transform:scale(1.04)}
.step{display:flex;gap:6px;align-items:center}.step button{padding:0;width:34px;height:34px;border-radius:50%;flex:0 0 34px;font-size:18px;line-height:1}
.step input{width:100%;min-width:0;text-align:center;padding:8px 4px;-moz-appearance:textfield}.step input::-webkit-inner-spin-button,.step input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.fm{margin-top:6px}
@media print{body::before{display:none}}

const LOGO_SRC=(MARK.match(/src="([^"]+)"/)||[])[1];
const hdr=()=>`<div class="lh"><img class="lhl" src="${LOGO_SRC}" alt="${SHOP.n}"><div class="lhc"><div class="lha">📍 ${SHOP.a}</div><div class="lhp">${SHOP.p.map(p=>`<a href="tel:${p}">📞 ${p}</a>`).join("")}</div><div class="lhe">✉️ ${SHOP.e}</div></div></div>`;
let S={users:[],goods:[],customers:[],sales:[],orders:[],expenses:[]},me=null,tab="",ref=null,ready=false,pub=false,inv=null,st=null,D={cust:"",items:[{n:"",q:1,p:0}],paid:""},msg="";
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode("shop:"+t)))].map(b=>b.toString(16).padStart(2,"0")).join("");
async function save(){const j=JSON.stringify(S);try{localStorage.setItem("shop",j)}catch(e){}if(ref){try{await ref.set({json:j})}catch(e){msg="Cloud save failed; saved on this device only."}}}
function load(j){try{S=Object.assign({users:[],goods:[],customers:[],sales:[],orders:[],expenses:[]},JSON.parse(j))}catch(e){}}

const tabs=r=>r==="owner"?["Overview","New sale","Goods","Customers","Orders","Team"]:r==="manager"?["Overview","New sale","Goods","Customers"]:["New sale","Goods"];
function draw(){if(!ready)return;const a=$("#app");
 if(!me){a.innerHTML=location.hash=="#staff"?login():catalog();return}
 const t=tabs(me.role);if(!t.includes(tab))tab=t[0];
 a.innerHTML=`<div class="top"><div class="bar"><div class="brand"><img class="lg" src="${LOGO_SRC}" alt="${SHOP.n}"></div><span class="mu">${esc(me.name)} (${me.role}) <button class="g" onclick="logout()">Log out</button></span></div>
 <div class="nav">${t.map(x=>`<button class="${x==tab?"on":""}" onclick="tab='${x}';inv=null;st=null;try{localStorage.setItem("tab",tab)}catch(e){}draw()">${IC[x]||""} ${x}</button>`).join("")}</div></div>${msg?`<div class="c red">${esc(msg)}</div>`:""}${inv?invoice():st?statement():view()}`;msg="";if(tab=="New sale"&&!inv)upd()}
function view(){return{Overview:overview,"New sale":sale,Goods:goods,Customers:custs,Orders:orders,Team:team,Expenses:expenses}[tab]()}
// ---------- auth ----------
function setup(){return`<div class="c"><h1>Create owner account</h1><p class="mu">First-time setup. The owner is the only person who can add managers and staff.</p>${form("Create owner","mkOwner()",1)}</div>`}
function login(){return`<div class="c">${hdr()}${form("Log in","doLogin()")}</div>`}
const catLink=()=>`<p style="text-align:center"><a href="#" onclick="pub=true;draw();return false">View goods &amp; place an order (customers)</a></p>`;
const form=(b,f,n)=>`${n?'<input id="nm" placeholder="Full name" style="width:100%;margin-bottom:6px">':""}<input id="em" type="email" placeholder="Email" style="width:100%;margin-bottom:6px"><input id="pw" type="password" placeholder="Password (min 6)" style="width:100%;margin-bottom:6px"><button onclick="${f}" style="width:100%">${b}</button>`;
async function mkOwner(){const e=$("#em").value.trim().toLowerCase(),p=$("#pw").value,n=$("#nm").value.trim();if(!e||p.length<6||!n)return alert("Enter name, email and a password of 6+ characters");
 S.users.push({id:uid(),name:n,email:e,role:"owner",h:await sha(e+p)});me=S.users[0];await save();draw()}
async function doLogin(){const e=$("#em").value.trim().toLowerCase(),h=await sha(e+$("#pw").value),u=S.users.find(u=>u.email===e&&u.h===h);if(!u)return alert("Wrong email or password");me=u;draw()}
// ---------- team ----------
function team(){return`<div class="c"><h2>Add manager / staff</h2><div class="row"><input id="tn" placeholder="Name"><input id="te" type="email" placeholder="Email"><input id="tp" placeholder="Password (min 6)"><select id="tr"><option>manager</option><option>staff</option></select><button onclick="addU()">Add</button></div></div>
<div class="c tw"><table><tr><th>Name</th><th>Email</th><th>Role</th><th></th></tr>${S.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${u.role}</td><td>${u.role!="owner"?`<button class="r" onclick="delU('${u.id}')">Remove</button>`:""}</td></tr>`).join("")}</table></div>`}
async function addU(){const e=$("#te").value.trim().toLowerCase(),p=$("#tp").value,n=$("#tn").value.trim();if(!n||!e||p.length<6)return alert("Name, email and 6+ char password required");if(S.users.some(u=>u.email===e))return alert("Email already used");
 S.users.push({id:uid(),name:n,email:e,role:$("#tr").value,h:await sha(e+p)});await save();draw()}
function delU(id){if(confirm("Remove this user?")){S.users=S.users.filter(u=>u.id!==id);save();draw()}}
// ---------- goods ----------
function goods(){const can=me.role!="staff";return`<div class="c"><h2>Goods memory</h2><p class="mu">Goods recorded in sales are remembered here automatically.</p>
<div class="row"><input id="gn" placeholder="Item name"><input id="gp" type="number" placeholder="Default price"><input id="gs" type="number" placeholder="Add stock qty"><button onclick="addG()">Save item</button></div></div>
<div class="c tw"><table><tr><th>Item</th><th>Price</th><th>Stock</th><th></th></tr>${S.goods.map(g=>`<tr><td>${esc(g.n)}</td><td>${M(g.p)}</td><td class="${(g.s||0)<=5?"red":""}">${g.s||0}</td><td>${can?`<button class="r" onclick="delG('${g.id}')">Delete</button>`:""}</td></tr>`).join("")||'<tr><td class="mu">No goods yet</td></tr>'}</table></div>`}
function upG(n,p,s){n=n.trim();if(!n)return;const g=S.goods.find(g=>g.n.toLowerCase()==n.toLowerCase());g?(g.p=+p||g.p,g.s=(g.s||0)+(+s||0)):S.goods.push({id:uid(),n,p:+p||0,s:+s||0})}
function addG(){upG($("#gn").value,$("#gp").value,$("#gs").value);save();draw()}
function delG(id){S.goods=S.goods.filter(g=>g.id!==id);save();draw()}
// ---------- sale ----------
function sale(){return`<div class="c"><h2>Record sale</h2><div class="row"><select id="sc" onchange="D.cust=this.value;upd()"><option value="">Walk-in / retail customer</option>${S.customers.map(c=>`<option value="${c.id}" ${D.cust==c.id?"selected":""}>${esc(c.n)} (wholesale)</option>`).join("")}</select>
<input id="nc" placeholder="Or add new wholesale customer"><button class="g" onclick="addC()">Add</button></div>
<datalist id="gl">${S.goods.map(g=>`<option value="${esc(g.n)}">`).join("")}</datalist>
${D.items.map((it,i)=>`<div class="row"><div class="sw" style="flex:3 1 150px"><input placeholder="Type item name" autocomplete="off" value="${esc(it.n)}" oninput="pick(${i},this.value)" onfocus="sug(${i},this.value)" onblur="setTimeout(()=>sug(${i},null),250)" style="width:100%"><div class="sgb" id="sg${i}"></div></div><input type="number" min="0" value="${it.q}" oninput="D.items[${i}].q=+this.value;upd()"><input type="number" id="p${i}" min="0" value="${it.p}" oninput="D.items[${i}].p=+this.value;upd()" title="Editable price"><b id="l${i}" style="flex:1 1 80px;text-align:right"></b><button class="r" onclick="D.items.splice(${i},1);if(!D.items.length)D.items.push({n:'',q:1,p:0});draw()" style="flex:0 0 36px">×</button></div>`).join("")}
<button class="g" onclick="D.items.push({n:'',q:1,p:0});draw()">+ Add item</button>
<div class="row" style="margin-top:10px"><span>Total: <span class="big" id="tt"></span></span><input id="pd" type="number" placeholder="Amount paid" value="${D.paid}" oninput="D.paid=this.value;upd()"><span>Balance: <b id="bl"></b></span></div>
<div id="dbt" class="mu"></div><button onclick="doSale()" style="width:100%;margin-top:8px">Save &amp; generate invoice</button></div>`}
function tot(){return D.items.reduce((s,i)=>s+i.q*i.p,0)}
function upd(){const t=tot(),p=D.paid===""?t:+D.paid;D.items.forEach((it,i)=>{const e=$("#l"+i);if(e)e.textContent=M(it.q*it.p)});$("#tt").textContent=M(t);const b=$("#bl");b.textContent=M(t-p);b.className=t-p>0?"red":"";const c=S.customers.find(c=>c.id==D.cust);$("#dbt").textContent=c?`Existing debt: ${M(c.debt)} → after this sale: ${M(c.debt+Math.max(0,t-p))}`:""}
function pick(i,v){D.items[i].n=v;const g=S.goods.find(g=>g.n.toLowerCase()==v.trim().toLowerCase());if(g){D.items[i].p=g.p;$("#p"+i).value=g.p}upd()}
function addC(){const n=$("#nc").value.trim();if(!n)return;const c={id:uid(),n,debt:0,pay:[]};S.customers.push(c);D.cust=c.id;save();draw()}
function doSale(){const it=D.items.filter(i=>i.n.trim()&&i.q>0);if(!it.length)return alert("Add at least one item");const t=tot(),p=D.paid===""?t:+D.paid;if(p>t)return alert("Paid exceeds total");
 const c=S.customers.find(c=>c.id==D.cust);if(!c&&p<t)return alert("Only wholesale customers can owe a balance. Pick or add a wholesale customer.");
 const fg=n=>S.goods.find(g=>g.n.toLowerCase()==n.trim().toLowerCase()),lo=it.filter(i=>{const g=fg(i.n);return g&&(g.s||0)<i.q}).map(i=>i.n);if(lo.length&&!confirm("Low stock: "+lo.join(", ")+". Continue?"))return;
 const prev=c?c.debt:0,bal=t-p;if(c)c.debt+=bal;it.forEach(i=>upG(i.n,i.p));it.forEach(i=>{const g=fg(i.n);if(g)g.s=Math.max(0,(g.s||0)-i.q)});
 const s={id:uid(),no:"INV-"+String(S.sales.length+1).padStart(4,"0"),d:new Date().toISOString(),cust:c?c.n:"Walk-in",cid:c?.id,items:it.map(i=>({...i})),t,p,bal,prev,now:c?c.debt:0,by:me.name};
 S.sales.push(s);inv=s;D={cust:"",items:[{n:"",q:1,p:0}],paid:""};save();draw()}
function invoice(){const s=inv;return`<div class="c">${hdr()}<div class="bar"><h2>Invoice ${s.no}${s.void?" — VOID":""}</h2><span class="noprint"><button onclick="window.print()">Print</button> ${!s.void&&me.role!="staff"?`<button class="r" onclick="voidS('${s.id}')">Void / refund</button> <button class="g" onclick="fixS('${s.id}')">Edit</button> `:""}<button class="g" onclick="inv=null;draw()">Close</button></span></div><p class="mu">${new Date(s.d).toLocaleString()} · ${esc(s.cust)} · by ${esc(s.by)}</p>
<div class="tw"><table><tr><th>Item</th><th>Qty</th><th>Price</th><th>Amount</th></tr>${s.items.map(i=>`<tr><td>${esc(i.n)}</td><td>${i.q}</td><td>${M(i.p)}</td><td>${M(i.q*i.p)}</td></tr>`).join("")}</table></div>
<p>Total: <b>${M(s.t)}</b><br>Amount paid: <b>${M(s.p)}</b><br>Remaining balance: <b class="${s.bal>0?"red":""}">${M(s.bal)}</b>${s.cid?`<br><span class="mu">Previous debt ${M(s.prev)} · Total debt now ${M(s.now)}</span>`:""}</p></div>`}
// ---------- customers / debts ----------

// ======== SALE FORM: SMART AUTOFILL ========
function sug(i,v){const b=$("#sg"+i);if(!b)return;if(v===null||!String(v).trim()){if(b)b.style.display="none";return}const q=v.trim().toLowerCase(),m=S.goods.filter(g=>g.n.toLowerCase().includes(q)).slice(0,6);if(!m.length||(m.length==1&&m[0].n.toLowerCase()==q)){b.style.display="none";return}b.innerHTML=m.map(g=>`<div class="sg" onmousedown="event.preventDefault()" onclick="useG(${i},'${g.id}')"><b>${esc(g.n)}</b><span>${M(g.p)} · stock ${g.s}</span></div>`).join("");b.style.display="block"}
function useG(i,id){const g=S.goods.find(x=>x.id==id);if(!g)return;D.items[i].n=g.n;D.items[i].p=g.p;D.items[i].q=D.items[i].q||1;draw()}
function pick(i,v){D.items[i].n=v;const g=S.goods.find(g=>g.n.toLowerCase()==v.trim().toLowerCase());if(g){D.items[i].p=g.p;const p=$("#p"+i);if(p)p.value=g.p}sug(i,v);upd()}

// ======== CUSTOMER PAGE: goods + name + phone only ========
function stp(b,d){const i=b.parentNode.querySelector("input");i.value=Math.max(0,(+i.value||0)+d);selc(i)}
function selc(i){i.closest(".pc").classList.toggle("sel",+i.value>0)}
function catalog(){return`<div class="top"><div class="bar"><div class="brand"><img class="lg" src="${LOGO_SRC}" alt="${SHOP.n}"></div></div></div>
<h2 class="gt">Choose your goods</h2><p class="mu">Select what you want, enter your name and phone number, then send your order. We will contact you.</p>
<div class="grid">${S.goods.map((g,k)=>`<div class="pc" style="animation-delay:${Math.min(k,12)*45}ms">${g.img?`<img src="${esc(g.img)}" alt="" loading="lazy">`:`<div class="ph">📱</div>`}<b>${esc(g.n)}</b><div class="step"><button onclick="stp(this,-1)">−</button><input type="number" min="0" placeholder="0" data-g="${esc(g.n)}" oninput="selc(this)"><button onclick="stp(this,1)">+</button></div></div>`).join("")}</div>${S.goods.length?"":'<p class="mu">No goods listed yet.</p>'}
<div class="c fm"><h2>Your details</h2><div class="row"><input id="on" placeholder="Your name" autocomplete="name"><input id="op" type="tel" placeholder="Phone number" autocomplete="tel"></div><button onclick="placeOrder()" style="width:100%">Send order 🚀</button></div>`}
window.addEventListener("hashchange",()=>{if(!me)draw()});
(async()=>{ready=true;const{data:{session}}=await sb.auth.getSession();if(session)await enter(session.user.id);else{await refresh();draw()}})();
